<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>夜阑 · 星座生成器</title>
<style>
  /* ============ 设计令牌（与 web 端 tokens.css 对齐） ============ */
  :root {
    --gold: #a08060;
    --gold-light: #c8a878;
    --gold-glow: rgba(200, 168, 120, 0.45);
    --bg-deep: #0c0a12;
    --bg-stage: #14101c;
    --panel: #1a1622;
    --panel-2: #221c2e;
    --line: rgba(200, 168, 120, 0.16);
    --text: #e8e2d6;
    --muted: #8a8398;
    --ok: #6fb98f;
    --danger: #d98a8a;
    --mono: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, monospace;
    /* 坐标域：x 0..100，y -40..100。总高 140，浮空区占 40/140 */
    --float-ratio: 28.5714%;  /* 浮空区在 stage 中所占顶部比例 = 40/140 */
    --card-h-ratio: 71.4286%; /* 卡面在 stage 中所占高度 = 100/140 */
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse 120% 80% at 50% -10%, #1a1426, var(--bg-deep));
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(20, 16, 28, 0.6);
    backdrop-filter: blur(6px);
    position: sticky; top: 0; z-index: 50;
  }
  header h1 {
    font-size: 16px; font-weight: 600; margin: 0;
    letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px;
  }
  header .star { color: var(--gold-light); font-size: 18px; }
  header .hint { font-size: 12px; color: var(--muted); margin-left: auto; }

  .layout {
    display: grid;
    grid-template-columns: minmax(360px, 1fr) 360px;
    gap: 18px;
    padding: 18px 22px 40px;
    align-items: start;
  }
  @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

  /* ============ 画布区 ============ */
  .canvas-wrap {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
  }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-bottom: 12px;
  }
  .toolbar .spacer { flex: 1; }
  .mode-hint {
    width: 100%; font-size: 12px; color: var(--muted); min-height: 16px;
  }

  /* stage = 完整可交互区（x 0..100, y -40..100） */
  .stage-host {
    display: flex; justify-content: center;
    background:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 70% 18%, rgba(255,255,255,0.25), transparent),
      radial-gradient(1px 1px at 45% 60%, rgba(255,255,255,0.18), transparent),
      radial-gradient(1px 1px at 85% 75%, rgba(255,255,255,0.22), transparent),
      var(--bg-stage);
    border-radius: 12px;
    padding: 18px;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: clamp(220px, 42vh, 340px);
    aspect-ratio: 340 / 728;   /* 浮空区(40) + 卡面(100) 共 140 行单位，按真实卡面比例 */
    touch-action: none;
    user-select: none;
  }
  /* 卡面本体（坐标 0..100 × 0..100） */
  .card-face {
    position: absolute; left: 0; right: 0;
    top: var(--float-ratio); height: var(--card-h-ratio);
    border-radius: 12px;
    border: 1px solid rgba(200, 168, 120, 0.28);
    background: radial-gradient(ellipse 70% 60% at 50% 55%, var(--panel-2), #14101c);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 60px rgba(0,0,0,0.4);
    overflow: visible;
  }

  /* 图片层：可自由移动 / 缩放 / 拉伸；坐标用 stage 百分比 */
  .img-layer { position: absolute; inset: 0; pointer-events: none; }
  .img-layer img {
    position: absolute;
    width: 100%; height: 100%;
    object-fit: fill;        /* 允许独立拉伸 */
    display: block;
    -webkit-user-drag: none;
  }
  .img-box {
    position: absolute;
    /* left/top/width/height 由 JS 以 stage 百分比设置 */
  }
  .img-box.adjust { outline: 1.5px dashed var(--gold-light); cursor: move; pointer-events: auto; }
  .handle {
    position: absolute; width: 12px; height: 12px;
    background: var(--gold-light); border: 1.5px solid #2a2233; border-radius: 3px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.6);
    pointer-events: auto;
  }
  .handle.nw { left: -6px; top: -6px; cursor: nwse-resize; }
  .handle.n  { left: calc(50% - 6px); top: -6px; cursor: ns-resize; }
  .handle.ne { right: -6px; top: -6px; cursor: nesw-resize; }
  .handle.e  { right: -6px; top: calc(50% - 6px); cursor: ew-resize; }
  .handle.se { right: -6px; bottom: -6px; cursor: nwse-resize; }
  .handle.s  { left: calc(50% - 6px); bottom: -6px; cursor: ns-resize; }
  .handle.sw { left: -6px; bottom: -6px; cursor: nesw-resize; }
  .handle.w  { left: -6px; top: calc(50% - 6px); cursor: ew-resize; }

  /* 引导 SVG（边框 / 网格 / 中线），不接收事件 */
  .guides, .interact {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    overflow: visible;
  }
  .guides { pointer-events: none; }
  .interact { pointer-events: auto; }
  .interact.locked { pointer-events: none; }

  /* ============ 右侧面板 ============ */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 13px; font-weight: 600; margin: 0 0 10px;
    color: var(--gold-light); letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 6px;
  }
  .panel h2 .count { color: var(--muted); font-weight: 400; }

  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row + .row { margin-top: 8px; }

  button.btn {
    font-family: inherit; font-size: 12.5px;
    color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 12px; cursor: pointer; transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  button.btn:hover { border-color: var(--gold); background: #2a2336; }
  button.btn.active { background: var(--gold); color: #1a1410; border-color: var(--gold-light); font-weight: 600; }
  button.btn.ghost { background: transparent; }
  button.btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  button.btn:disabled { opacity: 0.4; cursor: not-allowed; }
  button.btn.sm { padding: 4px 8px; font-size: 12px; }

  label.field { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  input[type="range"] { accent-color: var(--gold); }
  input[type="number"], input[type="text"] {
    font-family: var(--mono); font-size: 12px;
    background: #100d18; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px;
  }
  input[type="checkbox"] { accent-color: var(--gold); }

  .pt-list { display: grid; gap: 6px; max-height: 220px; overflow-y: auto; padding-right: 4px; }
  .pt-row { display: flex; align-items: center; gap: 6px; }
  .pt-row .id { font-family: var(--mono); width: 30px; color: var(--gold-light); font-size: 12px; }
  .pt-row input[type="number"] { width: 60px; }
  .empty { color: var(--muted); font-size: 12px; }

  .edge-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-family: var(--mono); font-size: 12px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 8px; display: inline-flex; align-items: center; gap: 5px;
  }
  .chip button { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0; font-size: 14px; line-height: 1; }
  .chip button:hover { color: var(--danger); }

  textarea {
    width: 100%; font-family: var(--mono); font-size: 12px; line-height: 1.5;
    background: #100d18; color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px;
    resize: vertical; min-height: 120px;
  }
  textarea[readonly] { color: #cfc8bb; }
  .msg { font-size: 12px; margin-top: 8px; line-height: 1.5; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--danger); }
  .msg ul { margin: 4px 0 0; padding-left: 18px; }

  .note { font-size: 11.5px; color: var(--muted); line-height: 1.6; }
  .coord-readout {
    font-family: var(--mono); font-size: 12px; color: var(--gold-light);
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 8px;
  }
  kbd {
    font-family: var(--mono); font-size: 11px; background: #100d18;
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
    padding: 1px 5px; color: var(--gold-light);
  }
</style>
</head>
<body>
<header>
  <h1><span class="star">✦</span> 夜阑 · 星座生成器</h1>
  <span class="hint">点击放点 · 连线成座 · 导出可粘进后台「文本导入」</span>
</header>

<div class="layout">
  <!-- ============ 左：画布 ============ -->
  <div class="canvas-wrap">
    <div class="toolbar" id="toolbar">
      <button class="btn active" data-mode="point">✛ 加点 / 移动</button>
      <button class="btn" data-mode="edge">／ 连线</button>
      <button class="btn" data-mode="erase">⌫ 删除</button>
      <button class="btn" data-mode="image">▣ 调整图片</button>
      <span class="spacer"></span>
      <span class="coord-readout" id="coordReadout">x — , y —</span>
      <div class="mode-hint" id="modeHint"></div>
    </div>

    <div class="stage-host">
      <div class="stage" id="stage">
        <div class="card-face"></div>

        <!-- 底图层 -->
        <div class="img-layer" id="imgLayer">
          <div class="img-box" id="imgBox" style="display:none;">
            <img id="bgImg" alt="底图" />
            <!-- 8 个缩放手柄（仅调整图片模式可见） -->
            <div class="handle nw" data-dir="nw"></div>
            <div class="handle n"  data-dir="n"></div>
            <div class="handle ne" data-dir="ne"></div>
            <div class="handle e"  data-dir="e"></div>
            <div class="handle se" data-dir="se"></div>
            <div class="handle s"  data-dir="s"></div>
            <div class="handle sw" data-dir="sw"></div>
            <div class="handle w"  data-dir="w"></div>
          </div>
        </div>

        <!-- 引导层 viewBox 同 web 端：0 -40 100 140 -->
        <svg class="guides" id="guides" viewBox="0 -40 100 140" preserveAspectRatio="none"></svg>

        <!-- 交互层：放点 / 连线 / 拖拽 -->
        <svg class="interact" id="interact" viewBox="0 -40 100 140" preserveAspectRatio="none"></svg>
      </div>
    </div>
  </div>

  <!-- ============ 右：控制面板 ============ -->
  <div>
    <!-- 底图 -->
    <div class="panel">
      <h2>▣ 底图（角色卡）</h2>
      <div class="row">
        <button class="btn" id="pickImg">选择图片…</button>
        <button class="btn ghost" id="fitImg" disabled>适配卡面</button>
        <button class="btn ghost danger" id="clearImg" disabled>移除</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none;" />
      </div>
      <div class="row">
        <label class="field" style="flex:1;">
          不透明度
          <input type="range" id="imgOpacity" min="0.1" max="1" step="0.05" value="0.85" style="flex:1;" disabled />
        </label>
      </div>
      <div class="note" style="margin-top:8px;">
        可拖拽 / 缩放 / 拉伸图片对齐卡面。也可直接把图片文件拖进画布，或 <kbd>Ctrl</kbd>+<kbd>V</kbd> 粘贴。
      </div>
    </div>

    <!-- 显示选项 -->
    <div class="panel">
      <h2>显示选项</h2>
      <div class="row">
        <label class="field"><input type="checkbox" id="optGrid" /> 网格</label>
        <label class="field"><input type="checkbox" id="optCenter" checked /> 中线(x=50)</label>
        <label class="field"><input type="checkbox" id="optSnap" /> 吸附整数</label>
        <label class="field"><input type="checkbox" id="optLabels" checked /> 显示 id</label>
      </div>
    </div>

    <!-- 星点 -->
    <div class="panel">
      <h2>星点 <span class="count" id="ptCount">(0/64)</span></h2>
      <div class="pt-list" id="ptList"></div>
    </div>

    <!-- 连线 -->
    <div class="panel">
      <h2>连线 <span class="count" id="edgeCount">(0/128)</span></h2>
      <div class="edge-list" id="edgeList"></div>
    </div>

    <!-- 导出 -->
    <div class="panel">
      <h2>导出文本</h2>
      <textarea id="dslOut" readonly spellcheck="false"></textarea>
      <div class="row" style="margin-top:8px;">
        <button class="btn" id="copyDsl">复制</button>
        <button class="btn ghost danger" id="clearAll">清空全部</button>
      </div>
    </div>

    <!-- 导入 -->
    <div class="panel">
      <h2>导入文本</h2>
      <textarea id="dslIn" spellcheck="false" placeholder="# 星点 id x y&#10;A 50 -25&#10;B 25 -10&#10;C 75 -10&#10;&#10;# 连线&#10;A-B&#10;A-C"></textarea>
      <div class="row" style="margin-top:8px;">
        <button class="btn" id="importDsl">解析并载入</button>
      </div>
      <div class="msg" id="importMsg"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================================
 * 坐标域 / 校验常量 —— 与 docs/tech/星座数据格式规范.md 及 @yelan/shared 对齐
 * x ∈ [0,100]，y ∈ [-40,100]，星点 ≤ 64，连线 ≤ 128
 * ========================================================================= */
const X_MIN = 0, X_MAX = 100, Y_MIN = -40, Y_MAX = 100;
const MAX_POINTS = 64, MAX_EDGES = 128;
const ID_RE = /^[A-Za-z0-9_]{1,40}$/;
const NS = 'http://www.w3.org/2000/svg';

const round1 = (v) => Math.round(v * 10) / 10;
const clampX = (v) => round1(Math.min(X_MAX, Math.max(X_MIN, v)));
const clampY = (v) => round1(Math.min(Y_MAX, Math.max(Y_MIN, v)));
const fmt = (n) => { const r = round1(n); return Number.isInteger(r) ? String(r) : String(r); };

/* ---------------- 状态 ---------------- */
const state = {
  points: [],            // { id, x, y }
  edges: [],             // { from, to }
  mode: 'point',         // point | edge | erase | image
  selected: null,        // 连线模式：第一个选中的星点 id
  img: null,             // { left, top, width, height } 单位 = stage 百分比
  opts: { grid: false, center: true, snap: false, labels: true },
};

/* ---------------- DOM ---------------- */
const stage = document.getElementById('stage');
const guides = document.getElementById('guides');
const interact = document.getElementById('interact');
const imgBox = document.getElementById('imgBox');
const bgImg = document.getElementById('bgImg');
const modeHint = document.getElementById('modeHint');
const coordReadout = document.getElementById('coordReadout');

/* =========================================================================
 * 行式 DSL 解析 / 序列化 —— 移植自 apps/admin/src/routes/constellation-dsl.ts
 * ========================================================================= */
function stripLine(raw) { const h = raw.indexOf('#'); return (h >= 0 ? raw.slice(0, h) : raw).trim(); }
function tokenize(line) { return line.split(/[\s,，]+/).filter(Boolean); }
function isNum(t) { return t.length > 0 && Number.isFinite(Number(t)); }

function parseDsl(text) {
  const errors = [];
  const points = [], edges = [];
  const seenIds = new Set(), seenEdges = new Set();
  const pending = [];
  const lines = text.split(/\r?\n/);

  lines.forEach((raw, idx) => {
    const ln = idx + 1;
    const line = stripLine(raw);
    if (!line) return;

    const oneToken = !/[\s,，]/.test(line);
    if (oneToken && /-/.test(line)) {
      const parts = line.replace(/->/g, '-').split('-').filter((s) => s.length > 0);
      if (parts.length !== 2) { errors.push(`第 ${ln} 行：连线格式应为 A-B，无法识别「${line}」`); return; }
      pending.push({ from: parts[0], to: parts[1], ln });
      return;
    }

    const tokens = tokenize(line);
    if (tokens.length === 3 && isNum(tokens[1]) && isNum(tokens[2])) {
      const id = tokens[0], x = Number(tokens[1]), y = Number(tokens[2]);
      if (!ID_RE.test(id)) { errors.push(`第 ${ln} 行：星点 id「${id}」非法，只允许字母/数字/下划线、长度 1..40`); return; }
      if (seenIds.has(id)) { errors.push(`第 ${ln} 行：星点 id「${id}」重复`); return; }
      if (x < X_MIN || x > X_MAX) { errors.push(`第 ${ln} 行：星点「${id}」x=${x} 超出范围 [${X_MIN}, ${X_MAX}]`); return; }
      if (y < Y_MIN || y > Y_MAX) { errors.push(`第 ${ln} 行：星点「${id}」y=${y} 超出范围 [${Y_MIN}, ${Y_MAX}]`); return; }
      seenIds.add(id); points.push({ id, x, y }); return;
    }

    if (tokens.length === 2) { pending.push({ from: tokens[0], to: tokens[1], ln }); return; }

    errors.push(`第 ${ln} 行：无法识别「${line}」（星点应为「id x y」，连线应为「A-B」）`);
  });

  for (const e of pending) {
    if (!ID_RE.test(e.from) || !ID_RE.test(e.to)) { errors.push(`第 ${e.ln} 行：连线端点 id 非法「${e.from}-${e.to}」`); continue; }
    if (e.from === e.to) { errors.push(`第 ${e.ln} 行：连线两端相同「${e.from}」`); continue; }
    if (!seenIds.has(e.from)) { errors.push(`第 ${e.ln} 行：连线引用了不存在的星点「${e.from}」`); continue; }
    if (!seenIds.has(e.to)) { errors.push(`第 ${e.ln} 行：连线引用了不存在的星点「${e.to}」`); continue; }
    const key = [e.from, e.to].sort().join(' ');
    if (seenEdges.has(key)) continue;
    seenEdges.add(key); edges.push({ from: e.from, to: e.to });
  }

  // 数量上限（对应 ConstellationSchema：points ≤ 64，edges ≤ 128）
  if (points.length > MAX_POINTS) errors.push(`星点数量 ${points.length} 超过上限 ${MAX_POINTS}`);
  if (edges.length > MAX_EDGES) errors.push(`连线数量 ${edges.length} 超过上限 ${MAX_EDGES}`);

  if (errors.length > 0) return { ok: false, errors };
  return { ok: true, data: { points, edges }, errors: [] };
}

function serializeDsl(points, edges) {
  const out = ['# 星点 id x y  (x:0..100, y:-40..100)'];
  for (const p of points) out.push(`${p.id} ${fmt(p.x)} ${fmt(p.y)}`);
  out.push('', '# 连线 from-to');
  for (const e of edges) out.push(`${e.from}-${e.to}`);
  return out.join('\n');
}

/* ---------------- 工具函数 ---------------- */
function genId() {
  const used = new Set(state.points.map((p) => p.id));
  for (let i = 0; i < 26; i++) { const ch = String.fromCharCode(65 + i); if (!used.has(ch)) return ch; }
  let n = 1; while (used.has(`P${n}`)) n++; return `P${n}`;
}
function sameEdge(a, b) { return (a.from === b.from && a.to === b.to) || (a.from === b.to && a.to === b.from); }

// 屏幕坐标 → 卡面坐标（viewBox 自动消化缩放）
function toCard(clientX, clientY) {
  const ctm = interact.getScreenCTM();
  if (!ctm) return null;
  const pt = interact.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  const p = pt.matrixTransform(ctm.inverse());
  return { x: p.x, y: p.y };
}
function maybeSnap(v) { return state.opts.snap ? Math.round(v) : v; }

/* =========================================================================
 * 渲染
 * ========================================================================= */
function renderGuides() {
  const g = [];
  // 浮空区
  g.push(`<rect x="0" y="-40" width="100" height="40" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.06)" stroke-width="0.4"/>`);
  // 卡面框
  g.push(`<rect x="0" y="0" width="100" height="100" fill="none" stroke="rgba(200,168,120,0.22)" stroke-width="0.5" stroke-dasharray="2 2"/>`);
  // 上边缘高亮
  g.push(`<line x1="0" y1="0" x2="100" y2="0" stroke="rgba(200,168,120,0.4)" stroke-width="0.6"/>`);
  if (state.opts.grid) {
    for (let x = 10; x < 100; x += 10) g.push(`<line x1="${x}" y1="-40" x2="${x}" y2="100" stroke="rgba(255,255,255,0.05)" stroke-width="0.3"/>`);
    for (let y = -40; y <= 100; y += 10) g.push(`<line x1="0" y1="${y}" x2="100" y2="${y}" stroke="rgba(255,255,255,0.05)" stroke-width="0.3"/>`);
  }
  if (state.opts.center) g.push(`<line x1="50" y1="-40" x2="50" y2="100" stroke="rgba(200,168,120,0.18)" stroke-width="0.4" stroke-dasharray="1 2"/>`);
  guides.innerHTML = g.join('');
}

function renderInteract() {
  const map = new Map(state.points.map((p) => [p.id, p]));
  const parts = [];

  // 连线
  parts.push(`<g stroke="var(--gold-glow)" stroke-width="0.55" opacity="0.7">`);
  state.edges.forEach((e, i) => {
    const a = map.get(e.from), b = map.get(e.to);
    if (!a || !b) return;
    parts.push(`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`);
    if (state.mode === 'erase') {
      parts.push(`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="transparent" stroke-width="4" style="cursor:pointer" data-edge="${i}"/>`);
    }
  });
  parts.push(`</g>`);

  // 星点（光晕分层，对齐 web 端 ConstellationField）
  state.points.forEach((p) => {
    const sel = state.selected === p.id;
    const cur = state.mode === 'point' ? 'grab' : 'pointer';
    parts.push(`<g data-id="${p.id}" style="cursor:${cur}">`);
    parts.push(`<circle cx="${p.x}" cy="${p.y}" r="3.6" fill="var(--gold-glow)" opacity="0.14"/>`);
    parts.push(`<circle cx="${p.x}" cy="${p.y}" r="1.8" fill="var(--gold-light)" opacity="0.42"/>`);
    parts.push(`<circle cx="${p.x}" cy="${p.y}" r="0.85" fill="#ffffff"/>`);
    if (sel) parts.push(`<circle cx="${p.x}" cy="${p.y}" r="4.6" fill="none" stroke="var(--gold-light)" stroke-width="0.6"/>`);
    parts.push(`<circle cx="${p.x}" cy="${p.y}" r="5" fill="transparent"/>`); // 命中区
    if (state.opts.labels) parts.push(`<text x="${p.x + 2.2}" y="${p.y - 2.2}" font-size="3.2" fill="rgba(200,168,120,0.85)" style="user-select:none;pointer-events:none;">${p.id}</text>`);
    parts.push(`</g>`);
  });

  interact.innerHTML = parts.join('');
}

function renderPanels() {
  // 星点列表
  document.getElementById('ptCount').textContent = `(${state.points.length}/${MAX_POINTS})`;
  const ptList = document.getElementById('ptList');
  if (state.points.length === 0) {
    ptList.innerHTML = `<div class="empty">暂无星点 —— 在左侧画布点击空白处添加</div>`;
  } else {
    ptList.innerHTML = state.points.map((p) => `
      <div class="pt-row" data-pid="${p.id}">
        <span class="id">${p.id}</span>
        <label class="field">x<input type="number" class="px" value="${fmt(p.x)}" min="${X_MIN}" max="${X_MAX}" step="1"></label>
        <label class="field">y<input type="number" class="py" value="${fmt(p.y)}" min="${Y_MIN}" max="${Y_MAX}" step="1"></label>
        <button class="btn sm danger del" title="删除">✕</button>
      </div>`).join('');
  }

  // 连线列表
  document.getElementById('edgeCount').textContent = `(${state.edges.length}/${MAX_EDGES})`;
  const edgeList = document.getElementById('edgeList');
  edgeList.innerHTML = state.edges.length === 0
    ? `<div class="empty">暂无连线 —— 用「连线」模式依次点两个星点</div>`
    : state.edges.map((e, i) => `<span class="chip">${e.from}–${e.to}<button data-eidx="${i}" title="删除">×</button></span>`).join('');

  // 导出文本
  document.getElementById('dslOut').value = serializeDsl(state.points, state.edges);
}

function renderAll() { renderGuides(); renderInteract(); renderPanels(); }

/* =========================================================================
 * 模式 / 提示
 * ========================================================================= */
const HINTS = {
  point: '点击空白处加星点，拖拽星点可移动',
  edge: '依次点两个星点连线（重复点同一对可取消）',
  erase: '点星点删点（连带其连线），点连线删线',
  image: '拖拽图片移动，拖角/边手柄缩放或拉伸',
};
function setMode(mode) {
  state.mode = mode;
  state.selected = null;
  document.querySelectorAll('#toolbar [data-mode]').forEach((b) => b.classList.toggle('active', b.dataset.mode === mode));
  modeHint.textContent = HINTS[mode];
  interact.classList.toggle('locked', mode === 'image');
  imgBox.classList.toggle('adjust', mode === 'image' && !!state.img);
  renderInteract();
}

/* =========================================================================
 * 星点 / 连线 交互
 * ========================================================================= */
let dragId = null, moved = false;

interact.addEventListener('pointerdown', (e) => {
  const nodeEl = e.target.closest('[data-id]');
  const edgeEl = e.target.closest('[data-edge]');

  if (state.mode === 'erase') {
    if (nodeEl) { removePoint(nodeEl.dataset.id); return; }
    if (edgeEl) { state.edges.splice(Number(edgeEl.dataset.edge), 1); renderAll(); return; }
    return;
  }

  if (state.mode === 'edge') {
    if (nodeEl) {
      const id = nodeEl.dataset.id;
      if (state.selected === null) { state.selected = id; }
      else { toggleEdge(state.selected, id); state.selected = null; }
      renderInteract();
    } else { state.selected = null; renderInteract(); }
    return;
  }

  if (state.mode === 'point') {
    if (nodeEl) {
      // 拖拽已有星点
      dragId = nodeEl.dataset.id; moved = false;
      interact.setPointerCapture(e.pointerId);
    } else {
      // 空白加点
      if (state.points.length >= MAX_POINTS) { flashImportErr([`星点已达上限 ${MAX_POINTS}`]); return; }
      const v = toCard(e.clientX, e.clientY); if (!v) return;
      state.points.push({ id: genId(), x: clampX(maybeSnap(v.x)), y: clampY(maybeSnap(v.y)) });
      renderAll();
    }
  }
});

interact.addEventListener('pointermove', (e) => {
  const v = toCard(e.clientX, e.clientY);
  if (v) coordReadout.textContent = `x ${clampX(v.x)} , y ${clampY(v.y)}`;
  if (state.mode === 'point' && dragId !== null && v) {
    moved = true;
    const p = state.points.find((pt) => pt.id === dragId);
    if (p) { p.x = clampX(maybeSnap(v.x)); p.y = clampY(maybeSnap(v.y)); renderInteract(); renderPanels(); }
  }
});
interact.addEventListener('pointerup', () => { dragId = null; });
interact.addEventListener('pointerleave', () => { dragId = null; coordReadout.textContent = 'x — , y —'; });

function toggleEdge(a, b) {
  if (a === b) return;
  const idx = state.edges.findIndex((e) => sameEdge(e, { from: a, to: b }));
  if (idx >= 0) state.edges.splice(idx, 1);
  else {
    if (state.edges.length >= MAX_EDGES) { flashImportErr([`连线已达上限 ${MAX_EDGES}`]); return; }
    state.edges.push({ from: a, to: b });
  }
  renderAll();
}
function removePoint(id) {
  state.points = state.points.filter((p) => p.id !== id);
  state.edges = state.edges.filter((e) => e.from !== id && e.to !== id);
  if (state.selected === id) state.selected = null;
  renderAll();
}

// 右侧星点表 x/y 编辑 + 删除
document.getElementById('ptList').addEventListener('input', (e) => {
  const row = e.target.closest('[data-pid]'); if (!row) return;
  const p = state.points.find((pt) => pt.id === row.dataset.pid); if (!p) return;
  if (e.target.classList.contains('px')) p.x = clampX(Number(e.target.value));
  if (e.target.classList.contains('py')) p.y = clampY(Number(e.target.value));
  renderInteract(); document.getElementById('dslOut').value = serializeDsl(state.points, state.edges);
});
document.getElementById('ptList').addEventListener('click', (e) => {
  if (e.target.closest('.del')) {
    const row = e.target.closest('[data-pid]'); if (row) removePoint(row.dataset.pid);
  }
});
document.getElementById('edgeList').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-eidx]'); if (!btn) return;
  state.edges.splice(Number(btn.dataset.eidx), 1); renderAll();
});

/* 键盘：Delete 删选中（连线模式选中点）/ Esc 取消选中 */
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'Escape') { state.selected = null; renderInteract(); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && state.selected) removePoint(state.selected);
});

/* =========================================================================
 * 工具栏 / 选项
 * ========================================================================= */
document.getElementById('toolbar').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-mode]'); if (btn) setMode(btn.dataset.mode);
});
function bindOpt(id, key, after) {
  document.getElementById(id).addEventListener('change', (e) => { state.opts[key] = e.target.checked; (after || renderAll)(); });
}
bindOpt('optGrid', 'grid');
bindOpt('optCenter', 'center');
bindOpt('optSnap', 'snap', () => {});
bindOpt('optLabels', 'labels');

document.getElementById('copyDsl').addEventListener('click', async () => {
  const text = serializeDsl(state.points, state.edges);
  try { await navigator.clipboard.writeText(text); flashImportOk('已复制到剪贴板'); }
  catch { const ta = document.getElementById('dslOut'); ta.select(); document.execCommand('copy'); flashImportOk('已复制'); }
});
document.getElementById('clearAll').addEventListener('click', () => {
  if (!state.points.length && !state.edges.length) return;
  if (!confirm('确定清空所有星点与连线？')) return;
  state.points = []; state.edges = []; state.selected = null; renderAll();
});

/* =========================================================================
 * 导入
 * ========================================================================= */
const importMsg = document.getElementById('importMsg');
function flashImportOk(text) { importMsg.className = 'msg ok'; importMsg.textContent = text; }
function flashImportErr(lines) {
  importMsg.className = 'msg err';
  importMsg.innerHTML = `解析失败（${lines.length}）：<ul>${lines.slice(0, 20).map((l) => `<li>${l}</li>`).join('')}</ul>`;
}
document.getElementById('importDsl').addEventListener('click', () => {
  const r = parseDsl(document.getElementById('dslIn').value);
  if (!r.ok) { flashImportErr(r.errors); return; }
  state.points = r.data.points.map((p) => ({ ...p }));
  state.edges = r.data.edges.map((e) => ({ ...e }));
  state.selected = null;
  renderAll();
  flashImportOk(`已载入 ${r.data.points.length} 个星点、${r.data.edges.length} 条连线`);
});

/* =========================================================================
 * 底图：选择 / 拖放 / 粘贴 / 移动 / 缩放 / 拉伸
 * ========================================================================= */
const fileInput = document.getElementById('fileInput');
document.getElementById('pickImg').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => { if (e.target.files[0]) loadImageFile(e.target.files[0]); });

function loadImageFile(file) {
  if (!file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = () => {
    bgImg.src = reader.result;
    // 默认铺满卡面（坐标 0..100 → stage 百分比：top=浮空比, height=卡面比）
    state.img = { left: 0, top: 100 * 40 / 140, width: 100, height: 100 * 100 / 140 };
    applyImg();
    ['fitImg', 'clearImg', 'imgOpacity'].forEach((id) => document.getElementById(id).disabled = false);
    if (state.mode !== 'image') setMode('image');
    else imgBox.classList.add('adjust');
  };
  reader.readAsDataURL(file);
}
function applyImg() {
  if (!state.img) { imgBox.style.display = 'none'; return; }
  imgBox.style.display = 'block';
  imgBox.style.left = state.img.left + '%';
  imgBox.style.top = state.img.top + '%';
  imgBox.style.width = state.img.width + '%';
  imgBox.style.height = state.img.height + '%';
}
document.getElementById('fitImg').addEventListener('click', () => {
  if (!state.img) return;
  state.img = { left: 0, top: 100 * 40 / 140, width: 100, height: 100 * 100 / 140 };
  applyImg();
});
document.getElementById('clearImg').addEventListener('click', () => {
  state.img = null; bgImg.src = ''; applyImg();
  ['fitImg', 'clearImg', 'imgOpacity'].forEach((id) => document.getElementById(id).disabled = true);
});
document.getElementById('imgOpacity').addEventListener('input', (e) => { bgImg.style.opacity = e.target.value; });

// 拖放文件到画布
['dragover', 'drop'].forEach((ev) => stage.addEventListener(ev, (e) => { e.preventDefault(); }));
stage.addEventListener('drop', (e) => { const f = e.dataTransfer.files[0]; if (f) loadImageFile(f); });
// 粘贴图片
window.addEventListener('paste', (e) => {
  const item = [...(e.clipboardData?.items || [])].find((it) => it.type.startsWith('image/'));
  if (item) loadImageFile(item.getAsFile());
});

// 图片移动 / 缩放（仅「调整图片」模式）—— 单位：stage 百分比
let imgDrag = null;
imgBox.addEventListener('pointerdown', (e) => {
  if (state.mode !== 'image' || !state.img) return;
  e.stopPropagation();
  const rect = stage.getBoundingClientRect();
  const dir = e.target.dataset.dir || 'move';
  imgDrag = { dir, sx: e.clientX, sy: e.clientY, rect, start: { ...state.img } };
  e.target.setPointerCapture(e.pointerId);
});
window.addEventListener('pointermove', (e) => {
  if (!imgDrag) return;
  const dxp = (e.clientX - imgDrag.sx) / imgDrag.rect.width * 100;   // stage % 增量
  const dyp = (e.clientY - imgDrag.sy) / imgDrag.rect.height * 100;
  const s = imgDrag.start, d = imgDrag.dir;
  let { left, top, width, height } = s;
  const MIN = 4;
  if (d === 'move') { left = s.left + dxp; top = s.top + dyp; }
  if (d.includes('e')) width = Math.max(MIN, s.width + dxp);
  if (d.includes('s')) height = Math.max(MIN, s.height + dyp);
  if (d.includes('w')) { width = Math.max(MIN, s.width - dxp); left = s.left + (s.width - width); }
  if (d.includes('n')) { height = Math.max(MIN, s.height - dyp); top = s.top + (s.height - height); }
  state.img = { left, top, width, height };
  applyImg();
});
window.addEventListener('pointerup', () => { imgDrag = null; });

/* ---------------- 初始化 ---------------- */
setMode('point');
renderAll();
</script>
</body>
</html>
