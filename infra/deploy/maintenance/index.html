<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#101925">
  <title>夜阑 · 维护中</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#101925;color:#eeeae2;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;padding:32px}
    main{width:min(100%,640px)}.brand{font-size:17px;letter-spacing:.3em;color:#b7b1a6;margin-bottom:72px}.line{width:38px;height:1px;background:#b6a181;margin-bottom:28px}
    .status{font-size:12px;letter-spacing:.18em;color:#b6a181;margin:0 0 16px}h1{font-size:clamp(28px,6vw,44px);line-height:1.4;font-weight:500;letter-spacing:.035em;margin:0 0 24px}
    p{font-size:15px;line-height:1.9;color:#b8bec6;margin:0}footer{margin-top:72px;padding-top:20px;border-top:1px solid #ffffff16;color:#89939f;font-size:12px;letter-spacing:.1em}
  </style>
</head>
<body><main>
  <div class="brand">夜阑 <span lang="en">YELAN</span></div>
  <div class="line" aria-hidden="true"></div>
  <p class="status">系统维护中</p>
  <h1>新的功能正在加入</h1>
  <p>夜阑正在更新，服务暂时休息。<br>请稍后再来，感谢你的耐心等待。</p>
  <footer>夜未央，对白未完。</footer>
</main></body>
</html>
