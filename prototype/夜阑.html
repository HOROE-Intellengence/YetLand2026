<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>夜阑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --bg-2: #0d0d14;
    --paper: #c8b8a4;
    --paper-dim: #8a7e6e;
    --paper-mute: #5a5248;
    --gold: #a08060;
    --gold-light: #c8a878;
    --gold-glow: rgba(200, 168, 120, 0.45);
    --ink: rgba(200, 184, 164, 0.05);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--paper);
    font-family: 'Noto Serif SC', Georgia, serif;
    font-weight: 300;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* Type scale — single knob. All UI text uses these tokens so changing
     --type-scale resizes everything proportionally. */
  :root {
    --type-scale: 1.3;        /* global multiplier — single knob */
    --fs-xxs: calc(11px * var(--type-scale));
    --fs-xs:  calc(12px * var(--type-scale));
    --fs-sm:  calc(13px * var(--type-scale));
    --fs-md:  calc(15px * var(--type-scale));
    --fs-lg:  calc(17px * var(--type-scale));
    --fs-xl:  calc(20px * var(--type-scale));
    --fs-2xl: calc(24px * var(--type-scale));
    --fs-3xl: calc(32px * var(--type-scale));
  }
  body { font-size: var(--fs-md); }
  #root { width: 100vw; height: 100vh; position: relative; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" src="scenes.jsx"></script>
<script type="text/babel" src="drawer.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
